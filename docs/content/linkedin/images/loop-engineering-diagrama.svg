<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1745 640" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Pipeline de agentes PO, Arquiteto, Dev, QA e Tech Lead, CI e Merge em main. O Dev tem um loop interno de lint, teste e build. Achados de QA/Tech Lead e falhas de CI reabrem o Dev automaticamente. O único ponto de parada humano é a confirmação antes do merge em main.">
  <defs>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="gateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1608"/>
      <stop offset="100%" stop-color="#120C1E"/>
    </linearGradient>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="gateGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6478"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818CF8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1745" height="640" fill="url(#bgFade)"/>
  <rect width="1745" height="6" fill="url(#topBar)"/>

  <text x="873" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#F1F5F9">Loop Engineering no pipeline de agentes</text>
  <text x="873" y="80" text-anchor="middle" font-size="14" fill="#8B95A8">cada seta de retorno se corrige sozinha até convergir — a única parada obrigatória é antes do merge em main</text>

  <!-- ===== stage cards ===== -->
  <!-- 1 PO -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="140" width="200" height="112" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="102" y="156" width="4" height="80" rx="2" fill="#64748B"/>
  <circle cx="90" cy="140" r="14" fill="#475569"/>
  <text x="90" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F1F5F9">1</text>
  <text x="196" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#F1F5F9">PO</text>
  <text x="196" y="222" text-anchor="middle" font-size="11" fill="#8B95A8">define o quê e por quê</text>

  <!-- 2 Arquiteto -->
  <g filter="url(#cardShadow)">
    <rect x="345" y="140" width="210" height="112" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="357" y="156" width="4" height="80" rx="2" fill="#64748B"/>
  <circle cx="345" cy="140" r="14" fill="#475569"/>
  <text x="345" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F1F5F9">2</text>
  <text x="452" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#F1F5F9">Arquiteto</text>
  <text x="452" y="222" text-anchor="middle" font-size="11" fill="#8B95A8">decide o como</text>

  <!-- 3 Dev (loop node, indigo) -->
  <g filter="url(#cardShadow)">
    <rect x="610" y="140" width="200" height="112" rx="16" fill="#181C36" stroke="#6366F1" stroke-width="1.5"/>
  </g>
  <rect x="622" y="156" width="4" height="80" rx="2" fill="#818CF8"/>
  <circle cx="610" cy="140" r="14" fill="#6366F1"/>
  <text x="610" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0B1120">3</text>
  <text x="717" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#EEF0FF">Dev</text>
  <text x="717" y="222" text-anchor="middle" font-size="11" fill="#A5ACF5">lint · teste · build</text>

  <!-- 4 QA + Tech Lead -->
  <g filter="url(#cardShadow)">
    <rect x="865" y="140" width="270" height="112" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="877" y="156" width="4" height="80" rx="2" fill="#64748B"/>
  <circle cx="865" cy="140" r="14" fill="#475569"/>
  <text x="865" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F1F5F9">4</text>
  <text x="1005" y="200" text-anchor="middle" font-size="15.5" font-weight="700" fill="#F1F5F9">QA + Tech Lead</text>
  <text x="1005" y="222" text-anchor="middle" font-size="11" fill="#8B95A8">veredito estruturado</text>

  <!-- 5 CI (amber) -->
  <g filter="url(#cardShadow)">
    <rect x="1190" y="140" width="200" height="112" rx="16" fill="#1E1808" stroke="#B45309" stroke-width="1.5"/>
  </g>
  <rect x="1202" y="156" width="4" height="80" rx="2" fill="#F59E0B"/>
  <circle cx="1190" cy="140" r="14" fill="#B45309"/>
  <text x="1190" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFBEB">5</text>
  <text x="1297" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#FDE9C4">CI</text>
  <text x="1297" y="222" text-anchor="middle" font-size="11" fill="#D6A24E">GitHub Actions</text>

  <!-- 6 Merge em main (gate) -->
  <ellipse cx="1550" cy="196" rx="120" ry="72" fill="#F59E0B" filter="url(#gateGlow)" opacity="0.22"/>
  <g filter="url(#cardShadow)">
    <rect x="1445" y="140" width="210" height="112" rx="16" fill="url(#gateFill)" stroke="#B45309" stroke-width="1.5"/>
  </g>
  <circle cx="1445" cy="140" r="14" fill="#F59E0B"/>
  <text x="1445" y="144.5" text-anchor="middle" font-size="12" font-weight="700" fill="#1E1608">6</text>
  <text x="1550" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Merge em main</text>
  <text x="1550" y="221" text-anchor="middle" font-size="11" font-weight="700" fill="#FBBF24">🔒 gate humano</text>

  <!-- forward flow arrows -->
  <line x1="290" y1="196" x2="341" y2="196" stroke="#3B4262" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="555" y1="196" x2="606" y2="196" stroke="#3B4262" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="810" y1="196" x2="861" y2="196" stroke="#3B4262" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="1135" y1="196" x2="1186" y2="196" stroke="#3B4262" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="1390" y1="196" x2="1441" y2="196" stroke="#3B4262" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- feedback: QA/Tech Lead -> Dev -->
  <path d="M1000,252 C1000,330 665,330 665,252" fill="none" stroke="#818CF8" stroke-width="2.25" marker-end="url(#arrowIndigo)"/>
  <rect x="705" y="316" width="300" height="28" rx="14" fill="#1B2036" stroke="#4C4F8A" stroke-width="1"/>
  <text x="855" y="334.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C7D2FE">achado reabre o Dev · até 3 tentativas</text>

  <!-- feedback: CI -> Dev -->
  <path d="M1290,252 L1290,384 Q1290,400 1274,400 L646,400 Q630,400 630,384 L630,252" fill="none" stroke="#D6942E" stroke-width="2" stroke-dasharray="1,6" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
  <rect x="798" y="396" width="430" height="28" rx="14" fill="#1E1808" stroke="#8A5A0F" stroke-width="1"/>
  <text x="1013" y="414.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#EAB565">CI falha → agente lê o log, corrige e repush sozinho</text>

  <!-- human gate banner -->
  <g filter="url(#cardShadow)">
    <rect x="523" y="470" width="700" height="42" rx="21" fill="#171018" stroke="#B45309" stroke-width="1"/>
  </g>
  <text x="873" y="496" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FBBF24">🔒 Único gate humano: confirmação antes do merge em main</text>

  <!-- legend -->
  <line x1="90" y1="546" x2="1655" y2="546" stroke="#20263B" stroke-width="1"/>
  <g font-size="12" fill="#8B95A8">
    <circle cx="176" cy="578" r="6" fill="#475569"/>
    <text x="192" y="582">etapa do pipeline</text>

    <circle cx="406" cy="578" r="6" fill="#6366F1"/>
    <text x="422" y="582">loop automático</text>

    <circle cx="626" cy="578" r="6" fill="#B45309"/>
    <text x="642" y="582">condicional (CI)</text>

    <circle cx="846" cy="578" r="6" fill="#F59E0B"/>
    <text x="862" y="582">gate humano obrigatório</text>
  </g>
</svg>
