<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1745 690" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Fluxo de RAG do currículo: indexação do resume.json em chunks por seção, embeddings da OpenAI e índice cacheado, executada uma única vez. A cada pergunta: histórico opcional, condensação condicional quando há histórico, busca por similaridade no índice, montagem do prompt e resposta do LLM. Sem histórico, ou se a condensação falhar, a pergunta pula direto para a busca.">
  <defs>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="heroFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="heroGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#818CF8"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1745" height="690" fill="url(#bgFade)"/>
  <rect width="1745" height="6" fill="url(#topBar)"/>

  <text x="873" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#F1F5F9">RAG do currículo: da pergunta à resposta</text>
  <text x="873" y="80" text-anchor="middle" font-size="14" fill="#8B95A8">a indexação roda uma vez · a segunda linha roda a cada pergunta</text>

  <text x="90" y="122" font-size="12.5" font-weight="700" fill="#A5B4FC" letter-spacing="1">INDEXAÇÃO — RODA 1×</text>

  <!-- ===== ROW 1: indexação ===== -->
  <!-- card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="136" width="215" height="110" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="102" y="152" width="4" height="78" rx="2" fill="#6366F1"/>
  <circle cx="90" cy="136" r="14" fill="#6366F1"/>
  <text x="90" y="140.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0B1120">1</text>
  <text x="198" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#E8EAF6">resume.json</text>

  <!-- card 2 -->
  <g filter="url(#cardShadow)">
    <rect x="415" y="136" width="340" height="110" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="427" y="152" width="4" height="78" rx="2" fill="#6366F1"/>
  <circle cx="415" cy="136" r="14" fill="#6366F1"/>
  <text x="415" y="140.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0B1120">2</text>
  <text x="585" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#E8EAF6">chunking por seção</text>

  <!-- card 3 -->
  <g filter="url(#cardShadow)">
    <rect x="865" y="136" width="340" height="110" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="877" y="152" width="4" height="78" rx="2" fill="#6366F1"/>
  <circle cx="865" cy="136" r="14" fill="#6366F1"/>
  <text x="865" y="140.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0B1120">3</text>
  <text x="1035" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#E8EAF6">embeddings (OpenAI)</text>

  <!-- card 4 -->
  <g filter="url(#cardShadow)">
    <rect x="1315" y="136" width="340" height="110" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="1327" y="152" width="4" height="78" rx="2" fill="#6366F1"/>
  <circle cx="1315" cy="136" r="14" fill="#6366F1"/>
  <text x="1315" y="140.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0B1120">4</text>
  <text x="1485" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#E8EAF6">índice JSON (cache)</text>

  <line x1="305" y1="191" x2="411" y2="191" stroke="#4C4F8A" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <line x1="755" y1="191" x2="861" y2="191" stroke="#4C4F8A" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <line x1="1205" y1="191" x2="1311" y2="191" stroke="#4C4F8A" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- connector: índice alimenta a busca -->
  <path d="M1485,246 C1485,330 800,330 800,430" fill="none" stroke="#8B87F0" stroke-width="2.25" marker-end="url(#arrowIndigo)"/>
  <rect x="1068" y="316" width="150" height="28" rx="14" fill="#1B2440" stroke="#4C4F8A" stroke-width="1"/>
  <text x="1143" y="334.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#C7D2FE">alimenta a busca</text>

  <!-- connector: bypass sem histórico -->
  <path d="M200,430 C200,356 720,356 720,430" fill="none" stroke="#5B6478" stroke-width="1.75" stroke-dasharray="1,6" stroke-linecap="round" marker-end="url(#arrowSlate)"/>
  <rect x="320" y="342" width="280" height="28" rx="14" fill="#161C2C" stroke="#33394F" stroke-width="1"/>
  <text x="460" y="360.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#94A0B8">sem histórico ou falha na condensação</text>

  <text x="90" y="412" font-size="12.5" font-weight="700" fill="#5EEAD4" letter-spacing="1">CADA PERGUNTA</text>

  <!-- ===== ROW 2: per-query flow ===== -->
  <!-- card 1 -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="430" width="220" height="108" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="102" y="446" width="4" height="76" rx="2" fill="#2DD4BF"/>
  <circle cx="90" cy="430" r="14" fill="#0D9488"/>
  <text x="90" y="434.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F0FDFA">1</text>
  <text x="200" y="490" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E8EAF6">pergunta + histórico</text>

  <!-- card 2 (conditional) -->
  <g filter="url(#cardShadow)">
    <rect x="355" y="430" width="250" height="108" rx="16" fill="#1E1808" stroke="#8A5A0F" stroke-width="1.25"/>
  </g>
  <rect x="367" y="446" width="4" height="76" rx="2" fill="#F59E0B"/>
  <circle cx="355" cy="430" r="14" fill="#B45309"/>
  <text x="355" y="434.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFBEB">2</text>
  <text x="480" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#FDE9C4">condensação da pergunta</text>
  <text x="480" y="500" text-anchor="middle" font-size="11" fill="#D6A24E">só roda se houver histórico</text>

  <!-- card 3 -->
  <g filter="url(#cardShadow)">
    <rect x="650" y="430" width="220" height="108" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="662" y="446" width="4" height="76" rx="2" fill="#2DD4BF"/>
  <circle cx="650" cy="430" r="14" fill="#0D9488"/>
  <text x="650" y="434.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F0FDFA">3</text>
  <text x="760" y="490" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E8EAF6">busca por similaridade</text>

  <!-- card 4 -->
  <g filter="url(#cardShadow)">
    <rect x="915" y="430" width="270" height="108" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="927" y="446" width="4" height="76" rx="2" fill="#2DD4BF"/>
  <circle cx="915" cy="430" r="14" fill="#0D9488"/>
  <text x="915" y="434.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F0FDFA">4</text>
  <text x="1050" y="478" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E8EAF6">prompt: system + histórico</text>
  <text x="1050" y="497" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E8EAF6">+ pergunta atual</text>

  <!-- card 5 -->
  <g filter="url(#cardShadow)">
    <rect x="1230" y="430" width="200" height="108" rx="16" fill="#141B2E" stroke="#2E3350" stroke-width="1.25"/>
  </g>
  <rect x="1242" y="446" width="4" height="76" rx="2" fill="#2DD4BF"/>
  <circle cx="1230" cy="430" r="14" fill="#0D9488"/>
  <text x="1230" y="434.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F0FDFA">5</text>
  <text x="1330" y="490" text-anchor="middle" font-size="13.5" font-weight="700" fill="#E8EAF6">LLM (gpt-4o-mini)</text>

  <!-- card 6 (hero result) -->
  <ellipse cx="1565" cy="484" rx="120" ry="72" fill="#22D3EE" filter="url(#heroGlow)" opacity="0.28"/>
  <g filter="url(#cardShadow)">
    <rect x="1475" y="430" width="180" height="108" rx="16" fill="url(#heroFill)"/>
  </g>
  <circle cx="1475" cy="430" r="14" fill="#0EA5E9"/>
  <text x="1475" y="434.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0B1120">6</text>
  <text x="1565" y="490" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">resposta</text>

  <line x1="310" y1="484" x2="351" y2="484" stroke="#3F6B63" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="605" y1="484" x2="646" y2="484" stroke="#3F6B63" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="870" y1="484" x2="911" y2="484" stroke="#3F6B63" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="1185" y1="484" x2="1226" y2="484" stroke="#3F6B63" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="1430" y1="484" x2="1471" y2="484" stroke="#3F6B63" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- legend -->
  <line x1="90" y1="590" x2="1655" y2="590" stroke="#20263B" stroke-width="1"/>
  <g font-size="12" fill="#8B95A8">
    <circle cx="96" cy="626" r="6" fill="#6366F1"/>
    <text x="112" y="630">indexação (roda 1×)</text>

    <circle cx="326" cy="626" r="6" fill="#0D9488"/>
    <text x="342" y="630">fluxo por pergunta</text>

    <circle cx="536" cy="626" r="6" fill="#B45309"/>
    <text x="552" y="630">etapa condicional</text>

    <circle cx="736" cy="626" r="6" fill="#0EA5E9"/>
    <text x="752" y="630">resultado final</text>

    <line x1="930" y1="626" x2="966" y2="626" stroke="#5B6478" stroke-width="2" stroke-dasharray="1,6"/>
    <text x="976" y="630">caminho alternativo (sem histórico)</text>
  </g>
</svg>
